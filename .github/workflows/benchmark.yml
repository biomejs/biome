name: Benchmarks

on:
  workflow_dispatch:
  merge_group:
  pull_request:
    types: [ opened, synchronize ]
    branches:
      - main
      - next
    paths:
      - '.github/workflows/benchmark.yml'
      - 'Cargo.lock'
      - 'crates/**'
  push:
    branches:
      - main
      - next
    paths:
      - '.github/workflows/benchmark.yml'
      - 'Cargo.lock'
      - 'crates/**'

env:
  RUST_LOG: info

jobs:
  changes:
    runs-on: depot-ubuntu-24.04-arm
    permissions:
      pull-requests: read
    outputs:
      js: ${{ steps.outputs.outputs.js }}
      json: ${{ steps.outputs.outputs.json }}
      yaml: ${{ steps.outputs.outputs.yaml }}
      css: ${{ steps.outputs.outputs.css }}
      html: ${{ steps.outputs.outputs.html }}
      graphql: ${{ steps.outputs.outputs.graphql }}
      markdown: ${{ steps.outputs.outputs.markdown }}
      grit: ${{ steps.outputs.outputs.grit }}
      tailwind: ${{ steps.outputs.outputs.tailwind }}
      configuration: ${{ steps.outputs.outputs.configuration }}
      manifests: ${{ steps.outputs.outputs.manifests }}
      module_graph: ${{ steps.outputs.outputs.module_graph }}
      service: ${{ steps.outputs.outputs.service }}
      console: ${{ steps.outputs.outputs.console }}
    steps:
      - name: Checkout Branch
        if: github.event_name == 'push'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2

      - name: Detect benchmark changes
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            js:
              - '.github/workflows/benchmark.yml'
              - 'Cargo.lock'
              - 'crates/biome_analyze/**/*.rs'
              - 'crates/biome_js_analyze/**/*.rs'
              - 'crates/biome_js_formatter/**/*.rs'
              - 'crates/biome_js_parser/**/*.rs'
              - 'crates/biome_js_*/**/*.rs'
              - 'crates/biome_formatter/**/*.rs'
              - 'crates/biome_rowan/**/*.rs'
              - 'crates/biome_parser/**/*.rs'
            json:
              - '.github/workflows/benchmark.yml'
              - 'Cargo.lock'
              - 'crates/biome_analyze/**/*.rs'
              - 'crates/biome_json_analyze/**/*.rs'
              - 'crates/biome_json_formatter/**/*.rs'
              - 'crates/biome_json_parser/**/*.rs'
              - 'crates/biome_json_*/**/*.rs'
              - 'crates/biome_formatter/**/*.rs'
              - 'crates/biome_rowan/**/*.rs'
              - 'crates/biome_parser/**/*.rs'
            yaml:
              - '.github/workflows/benchmark.yml'
              - 'Cargo.lock'
              - 'crates/biome_yaml_parser/Cargo.toml'
              - 'crates/biome_yaml_parser/benches/**/*'
              - 'crates/biome_yaml_formatter/Cargo.toml'
              - 'crates/biome_yaml_formatter/benches/**/*'
              - 'crates/biome_yaml_formatter/**/*.rs'
              - 'crates/biome_yaml_parser/**/*.rs'
              - 'crates/biome_yaml_*/**/*.rs'
              - 'crates/biome_rowan/**/*.rs'
              - 'crates/biome_parser/**/*.rs'
            css:
              - '.github/workflows/benchmark.yml'
              - 'Cargo.lock'
              - 'crates/biome_analyze/**/*.rs'
              - 'crates/biome_css_analyze/**/*.rs'
              - 'crates/biome_css_formatter/**/*.rs'
              - 'crates/biome_css_parser/benches/**/*'
              - 'crates/biome_css_parser/**/*.rs'
              - 'crates/biome_css_*/**/*.rs'
              - 'crates/biome_formatter/**/*.rs'
              - 'crates/biome_rowan/**/*.rs'
              - 'crates/biome_parser/**/*.rs'
            html:
              - '.github/workflows/benchmark.yml'
              - 'Cargo.lock'
              - 'crates/biome_analyze/**/*.rs'
              - 'crates/biome_html_analyze/**/*.rs'
              - 'crates/biome_html_formatter/**/*.rs'
              - 'crates/biome_html_parser/**/*.rs'
              - 'crates/biome_html_*/**/*.rs'
              - 'crates/biome_formatter/**/*.rs'
              - 'crates/biome_rowan/**/*.rs'
              - 'crates/biome_parser/**/*.rs'
            graphql:
              - '.github/workflows/benchmark.yml'
              - 'Cargo.lock'
              - 'crates/biome_analyze/**/*.rs'
              - 'crates/biome_graphql_formatter/**/*.rs'
              - 'crates/biome_graphql_parser/**/*.rs'
              - 'crates/biome_graphql_*/**/*.rs'
              - 'crates/biome_formatter/**/*.rs'
              - 'crates/biome_rowan/**/*.rs'
              - 'crates/biome_parser/**/*.rs'
            markdown:
              - '.github/workflows/benchmark.yml'
              - 'Cargo.lock'
              - 'crates/biome_markdown_analyze/Cargo.toml'
              - 'crates/biome_markdown_formatter/Cargo.toml'
              - 'crates/biome_markdown_parser/Cargo.toml'
              - 'crates/biome_markdown_*/benches/**/*'
              - 'crates/biome_markdown_parser/**/*.rs'
              - 'crates/biome_markdown_formatter/**/*.rs'
              - 'crates/biome_markdown_*/**/*.rs'
              - 'crates/biome_rowan/**/*.rs'
              - 'crates/biome_parser/**/*.rs'
            grit:
              - '.github/workflows/benchmark.yml'
              - 'Cargo.lock'
              - 'crates/biome_grit_parser/**/*.rs'
              - 'crates/biome_grit_patterns/**/*.rs'
              - 'crates/biome_grit_syntax/**/*.rs'
              - 'crates/biome_rowan/**/*.rs'
            tailwind:
              - '.github/workflows/benchmark.yml'
              - 'Cargo.lock'
              - 'crates/biome_tailwind_parser/**/*.rs'
              - 'crates/biome_tailwind_*/**/*.rs'
              - 'crates/biome_rowan/**/*.rs'
              - 'crates/biome_parser/**/*.rs'
            configuration:
              - '.github/workflows/benchmark.yml'
              - 'Cargo.lock'
              - 'crates/biome_configuration/**/*.rs'
              - 'crates/biome_rowan/**/*.rs'
            manifests:
              - '.github/workflows/benchmark.yml'
              - 'Cargo.lock'
              - 'crates/biome_package/**/*.rs'
              - 'crates/biome_rowan/**/*.rs'
            module_graph:
              - '.github/workflows/benchmark.yml'
              - 'Cargo.lock'
              - 'crates/biome_module_graph/**/*.rs'
              - 'crates/biome_rowan/**/*.rs'
            service:
              - '.github/workflows/benchmark.yml'
              - 'Cargo.lock'
              - 'crates/biome_analyze/**/*.rs'
              - 'crates/biome_configuration/**/*.rs'
              - 'crates/biome_fs/**/*.rs'
              - 'crates/biome_js_*/**/*.rs'
              - 'crates/biome_module_graph/**/*.rs'
              - 'crates/biome_parser/**/*.rs'
              - 'crates/biome_project_layout/**/*.rs'
              - 'crates/biome_resolver/**/*.rs'
              - 'crates/biome_rowan/**/*.rs'
              - 'crates/biome_service/**/*.rs'
              - 'crates/biome_workspace_db/**/*.rs'
            console:
              - '.github/workflows/benchmark.yml'
              - 'Cargo.lock'
              - 'crates/biome_console/**/*.rs'
              - 'crates/biome_console/Cargo.toml'

      - name: Set change outputs
        id: outputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          JS: ${{ steps.filter.outputs.js }}
          JSON: ${{ steps.filter.outputs.json }}
          YAML: ${{ steps.filter.outputs.yaml }}
          CSS: ${{ steps.filter.outputs.css }}
          HTML: ${{ steps.filter.outputs.html }}
          GRAPHQL: ${{ steps.filter.outputs.graphql }}
          MARKDOWN: ${{ steps.filter.outputs.markdown }}
          GRIT: ${{ steps.filter.outputs.grit }}
          TAILWIND: ${{ steps.filter.outputs.tailwind }}
          CONFIGURATION: ${{ steps.filter.outputs.configuration }}
          MANIFESTS: ${{ steps.filter.outputs.manifests }}
          MODULE_GRAPH: ${{ steps.filter.outputs.module_graph }}
          SERVICE: ${{ steps.filter.outputs.service }}
          CONSOLE: ${{ steps.filter.outputs.console }}
        run: |
          if [ "$EVENT_NAME" = 'workflow_dispatch' ] || [ "$EVENT_NAME" = 'merge_group' ]; then
            JS=true
            JSON=true
            YAML=true
            CSS=true
            HTML=true
            GRAPHQL=true
            MARKDOWN=true
            GRIT=true
            TAILWIND=true
            CONFIGURATION=true
            MANIFESTS=true
            MODULE_GRAPH=true
            SERVICE=true
            CONSOLE=true
          fi

          echo "js=$JS" >> "$GITHUB_OUTPUT"
          echo "json=$JSON" >> "$GITHUB_OUTPUT"
          echo "yaml=$YAML" >> "$GITHUB_OUTPUT"
          echo "css=$CSS" >> "$GITHUB_OUTPUT"
          echo "html=$HTML" >> "$GITHUB_OUTPUT"
          echo "graphql=$GRAPHQL" >> "$GITHUB_OUTPUT"
          echo "markdown=$MARKDOWN" >> "$GITHUB_OUTPUT"
          echo "grit=$GRIT" >> "$GITHUB_OUTPUT"
          echo "tailwind=$TAILWIND" >> "$GITHUB_OUTPUT"
          echo "configuration=$CONFIGURATION" >> "$GITHUB_OUTPUT"
          echo "manifests=$MANIFESTS" >> "$GITHUB_OUTPUT"
          echo "module_graph=$MODULE_GRAPH" >> "$GITHUB_OUTPUT"
          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "console=$CONSOLE" >> "$GITHUB_OUTPUT"

  js:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || needs.changes.outputs.js == 'true'
    permissions:
      contents: read
      pull-requests: write
    name: Bench JS / ${{ matrix.package }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - package: biome_js_parser
            bench: ''
            mode: simulation
            runner: depot-ubuntu-24.04-arm-16
          - package: biome_js_formatter
            bench: ''
            mode: simulation
            runner: depot-ubuntu-24.04-arm-16
          - package: biome_js_analyze
            bench: ''
            mode: simulation
            runner: depot-ubuntu-24.04-arm-16
    steps: &bench_steps
      - name: Checkout PR Branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install toolchain
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed
          cache-base: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile
        timeout-minutes: 20
        run: cargo codspeed build -m ${{ matrix.mode }} -p ${{ matrix.package }} ${{ matrix.bench }} ${{ matrix.build_args }}
        env:
          CARGO_BUILD_JOBS: 3 # Default is 4 (equals to the vCPU count of the runner), which leads OOM on cargo build

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@f22792bfac16f3e14eb9fbea76f4a48e9cc22b93 # v4.19.1
        timeout-minutes: 50
        with:
          mode: ${{ matrix.mode }}
          run: cargo codspeed run -m ${{ matrix.mode }} -p ${{ matrix.package }} ${{ matrix.bench }}
          token: ${{ secrets.CODSPEED_TOKEN }}

  service:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || needs.changes.outputs.service == 'true'
    permissions:
      contents: read
      pull-requests: write
    name: Bench Service / ${{ matrix.package }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - package: biome_service
            bench: --bench pull_diagnostics
            build_args: --features type_inference
            mode: simulation
            runner: depot-ubuntu-24.04-arm-16
    steps: *bench_steps

  console:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || needs.changes.outputs.console == 'true'
    permissions:
      contents: read
      pull-requests: write
    name: Bench Console
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - package: biome_console
            bench: ''
            mode: simulation
            runner: depot-ubuntu-24.04-arm-16
    steps: *bench_steps

  json:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || needs.changes.outputs.json == 'true'
    permissions:
      contents: read
      pull-requests: write
    name: Bench JSON / ${{ matrix.package }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - package: biome_json_parser
            bench: ''
            mode: simulation
            runner: depot-ubuntu-24.04-arm-16
          - package: biome_json_formatter
            bench: ''
            mode: simulation
            runner: depot-ubuntu-24.04-arm-16
          - package: biome_json_analyze
            bench: ''
            mode: simulation
            runner: depot-ubuntu-24.04-arm-16
    steps: *bench_steps

  yaml:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || needs.changes.outputs.yaml == 'true'
    permissions:
      contents: read
      pull-requests: write
    name: Bench YAML
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - package: biome_yaml_parser
            bench: ''
            mode: simulation
            runner: depot-ubuntu-24.04-arm-16
          - package: biome_yaml_formatter
            bench: ''
            mode: simulation
            runner: depot-ubuntu-24.04-arm-16
    steps: *bench_steps

  css:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || needs.changes.outputs.css == 'true'
    permissions:
      contents: read
      pull-requests: write
    name: Bench CSS / ${{ matrix.package }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - package: biome_css_parser
            bench: ''
            mode: simulation
            runner: depot-ubuntu-24.04-arm-16
          - package: biome_css_formatter
            bench: ''
            mode: simulation
            runner: depot-ubuntu-24.04-arm-16
          - package: biome_css_analyze
            bench: ''
            mode: simulation
            runner: depot-ubuntu-24.04-arm-16
    steps: *bench_steps

  html:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || needs.changes.outputs.html == 'true'
    permissions:
      contents: read
      pull-requests: write
    name: Bench HTML / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - name: parser
            package: biome_html_parser
            bench: --bench html_parser
            mode: simulation
            runner: depot-ubuntu-24.04-arm-16
          - name: formatter
            package: biome_html_formatter
            bench: ''
            mode: simulation
            runner: depot-ubuntu-24.04-arm-16
          - name: analyzer
            package: biome_html_analyze
            bench: ''
            mode: simulation
            runner: depot-ubuntu-24.04-arm-16
          - name: parser walltime
            package: biome_html_parser
            bench: --bench html_parser_walltime
            mode: walltime
            runner: codspeed-macro
    steps: *bench_steps

  graphql:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || needs.changes.outputs.graphql == 'true'
    permissions:
      contents: read
      pull-requests: write
    name: Bench GraphQL / ${{ matrix.package }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - package: biome_graphql_parser
            bench: ''
            mode: simulation
            runner: depot-ubuntu-24.04-arm-16
          - package: biome_graphql_formatter
            bench: ''
            mode: simulation
            runner: depot-ubuntu-24.04-arm-16
    steps: *bench_steps

  markdown:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || needs.changes.outputs.markdown == 'true'
    permissions:
      contents: read
      pull-requests: write
    name: Bench Markdown / ${{ matrix.mode }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - package: biome_markdown_parser
            bench: ''
            mode: simulation
            runner: depot-ubuntu-24.04-arm-16
          - package: biome_markdown_formatter
            bench: ''
            mode: simulation
            runner: depot-ubuntu-24.04-arm-16
          - package: biome_markdown_analyze
            bench: ''
            mode: simulation
            runner: depot-ubuntu-24.04-arm-16
    steps: *bench_steps

  grit:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || needs.changes.outputs.grit == 'true'
    permissions:
      contents: read
      pull-requests: write
    name: Bench GritQL
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - package: biome_grit_patterns
            bench: ''
            mode: simulation
            runner: depot-ubuntu-24.04-arm-16
    steps: *bench_steps

  tailwind:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || needs.changes.outputs.tailwind == 'true'
    permissions:
      contents: read
      pull-requests: write
    name: Bench Tailwind
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - package: biome_tailwind_parser
            bench: ''
            mode: simulation
            runner: depot-ubuntu-24.04-arm-16
    steps: *bench_steps

  configuration:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || needs.changes.outputs.configuration == 'true'
    permissions:
      contents: read
      pull-requests: write
    name: Bench Configuration
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - package: biome_configuration
            bench: ''
            mode: simulation
            runner: depot-ubuntu-24.04-arm-16
    steps: *bench_steps

  manifests:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || needs.changes.outputs.manifests == 'true'
    permissions:
      contents: read
      pull-requests: write
    name: Bench Manifests
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - package: biome_package
            bench: ''
            mode: simulation
            runner: depot-ubuntu-24.04-arm-16
    steps: *bench_steps

  module-graph:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || needs.changes.outputs.module_graph == 'true'
    permissions:
      contents: read
      pull-requests: write
    name: Bench Module Graph
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - package: biome_module_graph
            bench: ''
            mode: simulation
            runner: depot-ubuntu-24.04-arm-16
    steps: *bench_steps
