# Checks that the generated Tailwind preset matches the pinned tailwindcss version
name: Pull request Tailwind preset
on:
  merge_group:
  pull_request:
    branches:
      - main
    paths: # Only run when the generator, its dependencies or its output change
      - "packages/tailwindcss-config-analyzer/**"
      - "crates/biome_js_analyze/src/lint/nursery/use_sorted_classes/tailwind_preset_v4.rs"
      - "pnpm-lock.yaml"
      - "rust-toolchain.toml"
      - ".github/workflows/pull_request_tailwind_preset.yml"

# Cancel jobs when the PR is updated
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tailwind-preset:
    name: Check Tailwind preset
    runs-on: depot-ubuntu-24.04-arm
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The generator formats its output with rustfmt
      - name: Install toolchain
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          components: rustfmt
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Cache pnpm modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Generate the Tailwind preset
        run: |
          pnpm --filter tailwindcss-config-analyzer i --frozen-lockfile
          pnpm --filter tailwindcss-config-analyzer run execute:v4
      - name: Check that the preset is up to date
        run: git diff --exit-code -- crates/biome_js_analyze/src/lint/nursery/use_sorted_classes/tailwind_preset_v4.rs
