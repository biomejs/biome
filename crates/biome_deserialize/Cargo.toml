[package]
name                 = "biome_deserialize"
version.workspace    = true
authors.workspace    = true
edition.workspace    = true
description          = "Utilities to deserialize values"
homepage.workspace   = true
repository.workspace = true
license.workspace    = true
keywords.workspace   = true
categories.workspace = true
publish              = true

[package.metadata.cargo-udeps.ignore]
development = ["biome_deserialize", "biome_deserialize_macros"]

[dependencies]
biome_console     = { workspace = true }
biome_diagnostics = { workspace = true }
biome_json_parser = { workspace = true }
biome_json_syntax = { workspace = true }
biome_rowan       = { workspace = true }
biome_yaml_parser = { workspace = true, optional = true }
biome_yaml_syntax = { workspace = true, optional = true }
camino            = { workspace = true, optional = true }
enumflags2        = { workspace = true }
indexmap          = { workspace = true, optional = true }
serde             = { workspace = true, optional = true }
serde_json        = { workspace = true, optional = true }
smallvec          = { workspace = true, optional = true }

[dev-dependencies]
# Enables the optional data formats, so that their tests run
biome_deserialize        = { path = ".", features = ["yaml"] }
biome_deserialize_macros = { path = "../biome_deserialize_macros" }

[features]
camino   = ["dep:camino"]
indexmap = ["dep:indexmap"]
serde    = ["dep:serde", "dep:serde_json"]
smallvec = ["dep:smallvec"]
yaml     = ["dep:biome_yaml_parser", "dep:biome_yaml_syntax"]

[lints]
workspace = true
