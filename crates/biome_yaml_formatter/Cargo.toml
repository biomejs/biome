[package]
name                 = "biome_yaml_formatter"
version              = "0.1.0"
authors.workspace    = true
edition.workspace    = true
description          = "Biome's YAML formatter"
homepage.workspace   = true
repository.workspace = true
license.workspace    = true
keywords.workspace   = true
categories.workspace = true
include              = ["src/**/*"]
publish              = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# cargo-workspaces metadata
[package.metadata.workspaces]
independent = true

[[bench]]
harness = false
name    = "yaml_formatter"

[dependencies]
biome_deserialize = { workspace = true }
biome_diagnostics = { workspace = true }
biome_formatter   = { workspace = true }
biome_parser      = { workspace = true }
biome_rowan       = { workspace = true }
biome_suppression = { workspace = true }
biome_yaml_syntax = { workspace = true }
schemars          = { workspace = true, optional = true }
serde             = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
biome_configuration  = { path = "../biome_configuration/", features = ["lang_yaml"] }
biome_formatter      = { path = "../biome_formatter", features = ["countme"] }
biome_formatter_test = { path = "../biome_formatter_test", features = ["lang_yaml"] }
biome_fs             = { path = "../biome_fs" }
biome_languages      = { path = "../biome_languages", features = ["lang_yaml"] }
biome_service        = { path = "../biome_service", features = ["lang_yaml"] }
biome_test_utils     = { path = "../biome_test_utils", features = ["lang_yaml"] }
biome_yaml_parser    = { path = "../biome_yaml_parser" }
camino               = { workspace = true }
countme              = { workspace = true, features = ["enable"] }
criterion            = { package = "codspeed-criterion-compat", version = "=5.0.1" }
similar-asserts      = { workspace = true }
tests_macros         = { path = "../tests_macros" }

[target.'cfg(all(target_family="unix", not(all(target_arch = "aarch64", target_env = "musl"))))'.dev-dependencies]
tikv-jemallocator = { workspace = true }

[target.'cfg(target_os = "windows")'.dev-dependencies]
mimalloc = { workspace = true }

[features]
schema = ["dep:schemars", "serde"]
serde  = ["dep:serde"]

[lints]
workspace = true
