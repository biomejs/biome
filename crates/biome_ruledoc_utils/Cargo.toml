[package]
name                 = "biome_ruledoc_utils"
version              = "0.0.1"
authors.workspace    = true
edition.workspace    = true
description          = "Utilities for running code blocks in rule docs"
homepage.workspace   = true
repository.workspace = true
license.workspace    = true
keywords.workspace   = true
categories.workspace = true

[dependencies]
anyhow                      = { workspace = true }
biome_analyze               = { workspace = true }
biome_configuration         = { workspace = true }
biome_console               = { workspace = true }
biome_css_analyze           = { workspace = true }
biome_css_parser            = { workspace = true }
biome_css_semantic          = { workspace = true }
biome_css_syntax            = { workspace = true }
biome_db                    = { workspace = true }
biome_deserialize           = { workspace = true }
biome_diagnostics.workspace = true
biome_embeds                = { workspace = true }
biome_fs                    = { workspace = true }
biome_graphql_analyze       = { workspace = true }
biome_graphql_parser        = { workspace = true }
biome_graphql_syntax        = { workspace = true }
biome_html_analyze          = { workspace = true }
biome_html_parser           = { workspace = true }
biome_html_syntax           = { workspace = true }
biome_js_analyze            = { workspace = true }
biome_js_parser             = { workspace = true }
biome_js_semantic           = { workspace = true }
biome_js_syntax             = { workspace = true }
biome_json_analyze          = { workspace = true }
biome_json_factory          = { workspace = true }
biome_json_parser           = { workspace = true }
biome_json_syntax           = { workspace = true }
biome_languages             = { workspace = true, features = ["all"] }
biome_markdown_analyze      = { workspace = true }
biome_markdown_parser       = { workspace = true }
biome_markdown_syntax       = { workspace = true }
biome_module_graph          = { workspace = true }
biome_project_layout        = { workspace = true }
biome_rowan                 = { workspace = true }
biome_service               = {
  workspace = true,
  features  = ["lang_css", "lang_graphql", "lang_html", "lang_js", "lang_json", "lang_md", "lang_yaml"]
}
biome_test_utils            = { workspace = true, features = ["lang_css", "lang_html", "lang_js", "module_graph"] }
biome_text_edit             = { workspace = true }
camino                      = { workspace = true }

[lints]
workspace = true
