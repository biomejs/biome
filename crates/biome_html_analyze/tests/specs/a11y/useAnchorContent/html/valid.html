<!-- should not generate diagnostics -->

<!-- Simple text content -->
<a>content</a>

<!-- Nested text content -->
<a><span>content</span></a>

<!-- Mixed content with some hidden -->
<a><span aria-hidden="true"></span>content</a>

<!-- Text content with nested elements -->
<a><div aria-hidden="true"></div>content</a>

<!-- aria-hidden="false" should not hide content -->
<a aria-hidden="false">content</a>

<!-- Nested content with aria-hidden="false" -->
<a><span aria-hidden="false">content</span></a>

<!-- Image with alt text (self-closing provides content) -->
<a><img alt="description" /></a>

<!-- Link with title attribute and content -->
<a title="Home">Home</a>

<!-- Anchor with aria-label attribute and content -->
<a aria-label="Navigate to home page">Home</a>

<!-- Anchor with title attribute and nested content -->
<a title="Go to homepage"><span>Home</span></a>

<!-- Anchor with both aria-label and title -->
<a aria-label="Home" title="Navigate home">Home</a>
