[package]
name                 = "biome_yaml_analyze"
version              = "0.1.0"
authors.workspace    = true
edition.workspace    = true
homepage.workspace   = true
repository.workspace = true
license.workspace    = true
keywords.workspace   = true
categories.workspace = true

[[bench]]
harness = false
name    = "yaml_analyze"

[dependencies]
biome_analyze            = { workspace = true }
biome_analyze_macros     = { workspace = true }
biome_console            = { workspace = true }
biome_deserialize        = { workspace = true }
biome_deserialize_macros = { workspace = true }
biome_diagnostics        = { workspace = true }
biome_languages          = { workspace = true, features = ["lang_yaml"] }
biome_rowan              = { workspace = true }
biome_rule_options       = { workspace = true }
biome_suppression        = { workspace = true }
biome_yaml_factory       = { workspace = true }
biome_yaml_syntax        = { workspace = true }
camino                   = { workspace = true }
rustc-hash               = { workspace = true }
schemars                 = { workspace = true, optional = true }
serde                    = { workspace = true, features = ["derive"] }

[dev-dependencies]
biome_analyze     = { path = "../biome_analyze" }
biome_rowan       = { path = "../biome_rowan" }
biome_test_utils  = { path = "../biome_test_utils", features = ["lang_yaml"] }
biome_yaml_parser = { path = "../biome_yaml_parser" }
criterion         = { package = "codspeed-criterion-compat", version = "=5.0.1" }
insta             = { workspace = true }
tests_macros      = { path = "../tests_macros" }

[build-dependencies]
filetime = { workspace = true }

[target.'cfg(all(target_family="unix", not(all(target_arch = "aarch64", target_env = "musl"))))'.dev-dependencies]
tikv-jemallocator = { workspace = true }

[target.'cfg(target_os = "windows")'.dev-dependencies]
mimalloc = { workspace = true }

[lints]
workspace = true
