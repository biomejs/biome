[package]
name                 = "biome_formatter"
version.workspace    = true
authors.workspace    = true
edition.workspace    = true
description          = "Biome's formatter shared infrastructure"
homepage.workspace   = true
repository.workspace = true
license.workspace    = true
keywords.workspace   = true
categories.workspace = true
include              = ["LICENSE", "README.md", "src/**/*"]
publish              = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# cargo-workspaces metadata
[package.metadata.workspaces]
independent = true

[dependencies]
biome_console            = { workspace = true, optional = true }
biome_deserialize        = { workspace = true, optional = true }
biome_deserialize_macros = { workspace = true, optional = true }
biome_diagnostics        = { workspace = true, optional = true }
biome_rowan              = { workspace = true, optional = true }
biome_string_case        = { workspace = true }
biome_suppression        = { workspace = true, optional = true }
biome_text_size          = { workspace = true }
camino                   = { workspace = true }
countme                  = { workspace = true, optional = true }
drop_bomb                = "0.1.5"
indexmap                 = { workspace = true }
rustc-hash               = { workspace = true }
schemars                 = { workspace = true, optional = true }
serde                    = { workspace = true, features = ["derive"], optional = true }
unicode-width            = { workspace = true }

[dev-dependencies]
biome_js_parser = { path = "../biome_js_parser" }
biome_js_syntax = { path = "../biome_js_syntax" }
insta           = { workspace = true }

[features]
default     = ["deserialize", "diagnostics", "rowan"]
countme     = ["dep:countme"]
deserialize = ["dep:biome_deserialize", "dep:biome_deserialize_macros"]
diagnostics = ["dep:biome_console", "dep:biome_diagnostics"]
rowan       = ["dep:biome_diagnostics", "dep:biome_rowan", "dep:biome_suppression"]
schema      = ["biome_text_size/schema", "dep:schemars", "serde"]
serde       = ["biome_deserialize?/serde", "biome_rowan?/serde", "biome_text_size/serde", "dep:serde"]

[lints]
workspace = true
