[package]
name                 = "biome_mcp"
version              = "0.0.0"
authors.workspace    = true
edition.workspace    = true
description          = "Biome's Model Context Protocol server"
homepage.workspace   = true
repository.workspace = true
license.workspace    = true
keywords.workspace   = true
categories.workspace = true
publish              = false

[dependencies]
biome_configuration = { workspace = true }
biome_diagnostics   = { workspace = true }
biome_fs            = { workspace = true }
biome_languages     = { workspace = true }
biome_resolver      = { workspace = true }
biome_service       = { workspace = true, features = ["stable"] }
camino              = { workspace = true }
rmcp                = { workspace = true, features = ["macros", "schemars", "server", "transport-io"] }
schemars            = { workspace = true }
serde               = { workspace = true }
tokio               = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
insta = { workspace = true }
rmcp  = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true
