# should not generate diagnostics
query Sorted {
  users(after: "x", first: 10, orderBy: NAME) { id }
  alias: users(a: 1, b: 2) @include(if: true) @custom(a: 1, b: 2) { id }
  user(id: 1) { id }
  me { id }
  natural(_z: 1, A: 1, a9: 1, a10: 1, B: 1, b: 1) { id }
  duplicates(a: 1, b: 2, b: 3) { id }
  objectValue(a: { c: 1, b: 2 }) { id }
}

query Multiline {
  users(
    # about after
    after: "x" # after
    first: 10
  ) { id }
}

type Query {
  users(after: String, first: Int = 10 @deprecated, orderBy: Order): [User]
  user(id: ID!): User
  me: User
}

type Described {
  field(
    """
    Description of a
    """
    a: Int
    "Description of b"
    b: Int
  ): Int
}

directive @custom(a: Int, b: Int) on FIELD

directive @noArguments on FIELD
