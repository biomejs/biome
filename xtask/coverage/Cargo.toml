[package]
name    = "xtask_coverage"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
ascii_table           = { workspace = true }
backtrace             = { workspace = true }
biome_console         = { workspace = true }
biome_css_parser      = { workspace = true }
biome_diagnostics     = { workspace = true }
biome_js_parser       = { workspace = true }
biome_js_semantic     = { workspace = true }
biome_js_syntax       = { workspace = true }
biome_languages       = { workspace = true, features = ["lang_css", "lang_js"] }
biome_markdown_parser = { workspace = true, features = ["test_utils"] }
biome_markdown_syntax = { workspace = true }
biome_parser          = { workspace = true }
biome_rowan           = { workspace = true }
biome_string_case     = { workspace = true }
biome_yaml_parser     = { workspace = true }
biome_yaml_syntax     = { workspace = true }
camino                = { workspace = true }
colored               = { workspace = true }
indicatif             = { workspace = true, features = ["improved_unicode"] }
pico-args             = { workspace = true, features = ["eq-separator"] }
regex                 = { workspace = true }
serde                 = { workspace = true, features = ["derive"] }
serde_json            = { workspace = true }
serde_yaml            = { workspace = true }
tracing               = { workspace = true }
tracing-subscriber    = { workspace = true, features = ["env-filter", "std"] }
walkdir               = { workspace = true }
xtask_glue            = { workspace = true }
yastl                 = { workspace = true }

[lints]
workspace = true
